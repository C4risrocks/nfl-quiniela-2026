<!-- Live What-If Scenario Simulator Interactive Banner (Mobile-First, Non-Intrusive) -->
<div id="whatif-banner"
     x-data="whatIfSimulator()"
     class="vercel-card rounded-2xl overflow-hidden border border-purple-500/35 shadow-lg bg-gradient-to-b from-zinc-950 via-zinc-900 to-black transition-all duration-300 scroll-mt-20"
     @open-whatif.window="openBanner()"
     @close-whatif.window="closeBanner()"
     @toggle-whatif.window="toggleBanner()">

    <!-- Banner Header Strip (Always Visible - Acts as Toggle Bar) -->
    <div class="p-3.5 sm:p-4 bg-gradient-to-r from-purple-950/40 via-indigo-950/30 to-zinc-900 flex flex-wrap items-center justify-between gap-3 cursor-pointer select-none transition-colors hover:from-purple-950/60"
         @click="toggleBanner()">
        
        <div class="flex items-center space-x-3 min-w-0">
            <div class="w-9 h-9 sm:w-10 sm:h-10 rounded-xl bg-purple-500/20 border border-purple-500/40 flex items-center justify-center text-purple-400 text-sm sm:text-base shrink-0 shadow-inner">
                <i class="fa-solid fa-wand-magic-sparkles animate-pulse"></i>
            </div>
            <div class="min-w-0">
                <div class="flex items-center space-x-2">
                    <h3 class="text-xs sm:text-sm font-extrabold text-white tracking-tight truncate">
                        Simulador What-If en Vivo
                    </h3>
                    <span class="px-1.5 py-0.2 rounded text-[9px] font-mono font-bold bg-purple-500/25 text-purple-300 border border-purple-500/40">
                        INTERACTIVO
                    </span>
                </div>
                <!-- Collapsed / Active Simulation Summary Subtitle -->
                <p class="text-[11px] text-zinc-400 truncate mt-0.5" x-show="!isOpen">
                    <template x-if="simulatedGamesCount === 0">
                        <span>Simula quién gana y proyecta tu posición en la tabla al instante.</span>
                    </template>
                    <template x-if="simulatedGamesCount > 0">
                        <span class="text-purple-300 font-medium flex items-center space-x-1">
                            <span class="w-1.5 h-1.5 rounded-full bg-purple-400 animate-ping mr-1"></span>
                            <span x-text="simulatedGamesCount + ' partidos configurados'"></span>
                            <template x-if="currentUserSim">
                                <span> • Proyección: <strong class="text-white" x-text="'#' + currentUserSim.sim_rank"></strong> (<span x-text="currentUserSim.sim_points + ' pts'"></span>)</span>
                            </template>
                        </span>
                    </template>
                </p>
                <p class="text-[11px] text-zinc-400 truncate mt-0.5" x-show="isOpen">
                    Configura los ganadores de cada partido o usa los accesos rápidos.
                </p>
            </div>
        </div>

        <!-- Toggle & Close Controls -->
        <div class="flex items-center space-x-1.5 shrink-0">
            <template x-if="isOpen">
                <button type="button"
                        @click.stop="closeBanner()"
                        class="p-2 sm:px-2.5 sm:py-1.5 rounded-xl text-xs font-bold bg-zinc-800/90 hover:bg-zinc-700 text-zinc-300 hover:text-white border border-zinc-700 transition-all flex items-center space-x-1 cursor-pointer"
                        title="Cerrar simulador (X)">
                    <i class="fa-solid fa-xmark text-xs"></i>
                    <span class="hidden sm:inline">Cerrar</span>
                </button>
            </template>

            <button type="button"
                    @click.stop="toggleBanner()"
                    class="px-3 py-1.5 rounded-xl text-xs font-bold transition-all shadow-sm flex items-center space-x-1.5 cursor-pointer"
                    :class="isOpen ? 'bg-zinc-900 hover:bg-zinc-800 text-zinc-300 border border-zinc-800' : 'bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white border border-purple-400/40 hover:scale-[1.02]'">
                <template x-if="!isOpen">
                    <span class="flex items-center space-x-1">
                        <span>Abrir Simulador</span>
                        <i class="fa-solid fa-chevron-down text-[10px]"></i>
                    </span>
                </template>
                <template x-if="isOpen">
                    <span class="flex items-center space-x-1">
                        <span>Minimizar</span>
                        <i class="fa-solid fa-chevron-up text-[10px]"></i>
                    </span>
                </template>
            </button>
        </div>
    </div>

    <!-- Expanded Interactive Body (Inline in Normal Flow, Non-Intrusive) -->
    <div x-show="isOpen" 
         x-transition:enter="transition ease-out duration-200"
         x-transition:enter-start="opacity-0 -translate-y-2"
         x-transition:enter-end="opacity-100 translate-y-0"
         x-transition:leave="transition ease-in duration-150"
         x-transition:leave-start="opacity-100 translate-y-0"
         x-transition:leave-end="opacity-0 -translate-y-2"
         class="border-t border-purple-500/20 bg-zinc-950/95">

        <!-- Scenario Presets Bar (Modes: Pleno por defecto, Peor escenario para ganar, Manual) -->
        <div class="p-3 bg-zinc-900/70 border-b border-zinc-800/80 space-y-2.5">
            <div class="flex items-center justify-between gap-2">
                <div class="flex items-center space-x-1.5 overflow-x-auto no-scrollbar text-xs">
                    <span class="text-[10px] font-mono font-bold text-zinc-500 uppercase tracking-wider mr-1 shrink-0">Modo:</span>
                    
                    {{if .User}}
                        <!-- Preset 1: Pleno (Por Defecto) -->
                        <button type="button"
                                @click="simulateMyPicks()"
                                title="Asignar ganador según todos tus pronósticos restantes"
                                :class="currentScenario === 'all_picks' ? 'bg-purple-600 text-white border-purple-400/60 shadow-md ring-1 ring-purple-400/40' : 'bg-purple-500/15 hover:bg-purple-500/25 text-purple-300 border-purple-500/30'"
                                class="px-2.5 py-1.5 rounded-xl border font-bold transition-all cursor-pointer whitespace-nowrap text-[11px] flex items-center space-x-1.5">
                            <i class="fa-solid fa-bullseye text-[10px]"></i>
                            <span>Pleno (Mis Picks)</span>
                            <span class="px-1 py-0.2 rounded text-[8px] font-mono bg-purple-900/60 text-purple-200 border border-purple-400/30" x-show="currentScenario === 'all_picks'">Por Defecto</span>
                        </button>

                        <!-- Preset 2: Peor Escenario para Ganar -->
                        <button type="button"
                                @click="simulateWorstCaseWin()"
                                title="Calcular los mínimos aciertos necesarios para asegurar el #1 o campeonato"
                                :class="currentScenario === 'worst_case_win' ? 'bg-gradient-to-r from-amber-600 to-yellow-600 text-white border-amber-300 shadow-md ring-1 ring-amber-400/40' : 'bg-amber-500/15 hover:bg-amber-500/25 text-amber-300 border-amber-500/30'"
                                class="px-2.5 py-1.5 rounded-xl border font-bold transition-all cursor-pointer whitespace-nowrap text-[11px] flex items-center space-x-1.5">
                            <i class="fa-solid fa-shield-halved text-[10px]"></i>
                            <span>Peor Escenario para Ganar</span>
                            <i class="fa-solid fa-crown text-[9px] text-amber-300" x-show="currentScenario === 'worst_case_win'"></i>
                        </button>
                    {{end}}

                    <!-- Mode 3: Manual Indicator / Trigger -->
                    <button type="button"
                            @click="currentScenario = 'manual'"
                            title="Personalizar resultados partido por partido"
                            :class="currentScenario === 'manual' ? 'bg-cyan-600 text-white border-cyan-400 shadow-md ring-1 ring-cyan-400/40' : 'bg-cyan-500/15 hover:bg-cyan-500/25 text-cyan-300 border-cyan-500/30'"
                            class="px-2.5 py-1.5 rounded-xl border font-semibold transition-all cursor-pointer whitespace-nowrap text-[11px] flex items-center space-x-1.5">
                        <i class="fa-solid fa-sliders text-[10px]"></i>
                        <span>Manual</span>
                    </button>
                </div>

                <!-- Secondary Actions: Live, Consensus, Reset -->
                <div class="flex items-center space-x-1.5 shrink-0">
                    <button type="button"
                            @click="simulateLiveScores()"
                            title="Asignar ganador a quien va ganando actualmente en partidos activos"
                            :class="currentScenario === 'live' ? 'bg-red-600 text-white border-red-400' : 'bg-zinc-800/80 hover:bg-zinc-700 text-zinc-300 border-zinc-700'"
                            class="px-2 py-1 rounded-lg border font-medium transition-all cursor-pointer whitespace-nowrap text-[10px] flex items-center space-x-1">
                        <span class="w-1.5 h-1.5 rounded-full bg-red-400 animate-pulse"></span>
                        <span class="hidden sm:inline">En Vivo</span>
                    </button>

                    <button type="button"
                            @click="simulateConsensus()"
                            title="Asignar ganador al favorito de la quiniela"
                            :class="currentScenario === 'consensus' ? 'bg-zinc-700 text-white border-zinc-500' : 'bg-zinc-800/80 hover:bg-zinc-700 text-zinc-300 border-zinc-700'"
                            class="px-2 py-1 rounded-lg border font-medium transition-all cursor-pointer whitespace-nowrap text-[10px] flex items-center space-x-1">
                        <i class="fa-solid fa-users text-[9px]"></i>
                        <span class="hidden sm:inline">Consenso</span>
                    </button>

                    <button type="button"
                            @click="resetAll()"
                            title="Limpiar todas las selecciones simuladas"
                            class="p-1 sm:px-2 sm:py-1 rounded-lg bg-zinc-800/60 hover:bg-zinc-700 text-zinc-400 hover:text-white border border-zinc-700 font-medium transition-all cursor-pointer whitespace-nowrap text-[10px]">
                        <i class="fa-solid fa-rotate-left sm:mr-1 text-[9px]"></i><span class="hidden sm:inline">Limpiar</span>
                    </button>
                </div>
            </div>

            <!-- Active Scenario Explanatory Sub-Banner -->
            <div class="text-[11px] font-medium px-2.5 py-1.5 rounded-xl border flex items-center justify-between"
                 :class="{
                    'bg-purple-950/40 border-purple-500/30 text-purple-200': currentScenario === 'all_picks',
                    'bg-amber-950/40 border-amber-500/30 text-amber-200': currentScenario === 'worst_case_win',
                    'bg-cyan-950/40 border-cyan-500/30 text-cyan-200': currentScenario === 'manual',
                    'bg-zinc-900 border-zinc-800 text-zinc-400': currentScenario !== 'all_picks' && currentScenario !== 'worst_case_win' && currentScenario !== 'manual'
                 }">
                <div class="flex items-center space-x-1.5 min-w-0">
                    <template x-if="currentScenario === 'all_picks'">
                        <span class="truncate">
                            <strong class="text-purple-300">🎯 Escenario Pleno:</strong> Proyectando el resultado si aciertas todos tus pronósticos restantes.
                        </span>
                    </template>
                    <template x-if="currentScenario === 'worst_case_win'">
                        <span class="truncate">
                            <strong class="text-amber-300">🛡️ Peor Escenario Ganador:</strong>
                            <template x-if="worstCaseInsight">
                                <span>Aseguras la posición <strong class="text-white" x-text="'#' + worstCaseInsight.targetRank"></strong> ganando únicamente <strong class="text-amber-300" x-text="worstCaseInsight.neededWins + ' de ' + worstCaseInsight.totalPending"></strong> partidos clave (en dorado).</span>
                            </template>
                            <template x-if="!worstCaseInsight">
                                <span>Calculando la combinación más hostil en la que aún te coronas campeón...</span>
                            </template>
                        </span>
                    </template>
                    <template x-if="currentScenario === 'manual'">
                        <span class="truncate">
                            <strong class="text-cyan-300">✏️ Modo Manual:</strong> Personaliza los ganadores tocando a cualquier equipo. (<span x-text="simulatedGamesCount + ' configurados'"></span>)
                        </span>
                    </template>
                    <template x-if="currentScenario === 'live'">
                        <span class="truncate"><strong>🔴 Al Momento:</strong> Ganadores asignados según el marcador en vivo.</span>
                    </template>
                    <template x-if="currentScenario === 'consensus'">
                        <span class="truncate"><strong>👥 Consenso:</strong> Ganadores asignados según el favorito de la quiniela.</span>
                    </template>
                </div>
                <button type="button" @click="activeTab = 'leaderboard'" class="text-[10px] underline font-bold shrink-0 ml-2 hover:opacity-80 cursor-pointer">Ver Tabla &rarr;</button>
            </div>
        </div>

        <!-- Spotlight Card: User's Projected Standing -->
        <template x-if="currentUserSim">
            <div class="m-3 sm:m-4 p-4 rounded-2xl bg-gradient-to-br from-purple-950/40 via-zinc-900 to-zinc-950 border border-purple-500/30 shadow-md">
                <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                    <div class="flex items-center space-x-3">
                        <div class="w-12 h-12 rounded-2xl bg-purple-600/20 border border-purple-500/40 flex flex-col items-center justify-center font-mono font-black text-white shrink-0">
                            <span class="text-[9px] text-purple-300 uppercase leading-none">Posición</span>
                            <span class="text-xl text-purple-200 leading-none mt-0.5" x-text="'#' + currentUserSim.sim_rank"></span>
                        </div>
                        <div>
                            <div class="text-xs font-bold text-white flex items-center space-x-1.5">
                                <span x-text="currentUserSim.username"></span>
                                <span class="text-[9px] font-mono px-1.5 py-0.2 rounded bg-white text-black font-extrabold">TÚ</span>
                            </div>
                            <div class="flex items-center space-x-2 mt-1">
                                <!-- Rank Delta Pill -->
                                <template x-if="currentUserSim.rank_delta > 0">
                                    <span class="inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-mono font-bold bg-emerald-500/20 text-emerald-300 border border-emerald-500/30">
                                        <i class="fa-solid fa-arrow-up text-[8px] mr-1"></i> Subes <span x-text="currentUserSim.rank_delta" class="ml-0.5"></span> pos.
                                    </span>
                                </template>
                                <template x-if="currentUserSim.rank_delta < 0">
                                    <span class="inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-mono font-bold bg-rose-500/20 text-rose-300 border border-rose-500/30">
                                        <i class="fa-solid fa-arrow-down text-[8px] mr-1"></i> Bajas <span x-text="Math.abs(currentUserSim.rank_delta)" class="ml-0.5"></span> pos.
                                    </span>
                                </template>
                                <template x-if="currentUserSim.rank_delta === 0">
                                    <span class="inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-mono text-zinc-400 bg-zinc-900 border border-zinc-800">
                                        <i class="fa-solid fa-minus text-[8px] mr-1 text-zinc-500"></i> Sin cambio
                                    </span>
                                </template>
                            </div>
                        </div>
                    </div>

                    <div class="flex items-center space-x-4 self-end sm:self-auto font-mono text-right">
                        <div>
                            <div class="text-[10px] text-zinc-400 uppercase tracking-wider">Puntos Base</div>
                            <div class="text-base font-bold text-zinc-300" x-text="currentUserSim.base_points + ' pts'"></div>
                        </div>
                        <div>
                            <div class="text-[10px] text-purple-400 uppercase tracking-wider font-semibold">+ Simulados</div>
                            <div class="text-base font-black text-purple-300" x-text="'+' + currentUserSim.sim_hits + ' pts'"></div>
                        </div>
                        <div class="pl-2 border-l border-zinc-800">
                            <div class="text-[10px] text-amber-400 uppercase tracking-wider font-bold">Total Proyectado</div>
                            <div class="text-xl font-black text-amber-300" x-text="currentUserSim.sim_points + ' pts'"></div>
                        </div>
                    </div>
                </div>
            </div>
        </template>

        <!-- Navigation Tabs: Games to Simulate vs Leaderboard Projection -->
        <div class="px-4 border-b border-zinc-800 flex items-center space-x-3 text-xs font-semibold">
            <button type="button"
                    @click="activeTab = 'games'"
                    :class="activeTab === 'games' ? 'border-purple-500 text-white font-bold' : 'border-transparent text-zinc-400 hover:text-zinc-200'"
                    class="py-2.5 border-b-2 transition-all cursor-pointer flex items-center space-x-1.5">
                <i class="fa-solid fa-football text-purple-400 text-[11px]"></i>
                <span>Partidos a Simular</span>
                <span class="ml-1 px-1.5 py-0.2 rounded-full text-[10px] font-mono bg-zinc-800 text-zinc-300" x-text="simulatedGamesCount + '/' + games.length"></span>
            </button>
            <button type="button"
                    @click="activeTab = 'leaderboard'"
                    :class="activeTab === 'leaderboard' ? 'border-purple-500 text-white font-bold' : 'border-transparent text-zinc-400 hover:text-zinc-200'"
                    class="py-2.5 border-b-2 transition-all cursor-pointer flex items-center space-x-1.5">
                <i class="fa-solid fa-ranking-star text-amber-400 text-[11px]"></i>
                <span>Tabla Proyectada</span>
            </button>
        </div>

        <!-- Tab 1: Interactive Games List -->
        <div x-show="activeTab === 'games'" class="p-3 sm:p-4 overflow-y-auto flex-1 space-y-2">
            <template x-for="g in games" :key="g.id">
                <div class="p-2.5 sm:p-3 rounded-xl bg-zinc-900/70 border border-zinc-800/80 flex flex-col gap-2">
                    
                    <!-- Game Info Header -->
                    <div class="flex items-center justify-between text-[10px] font-mono text-zinc-400">
                        <div class="flex items-center space-x-1.5">
                            <template x-if="g.status === 'final'">
                                <span class="px-1.5 py-0.2 rounded bg-zinc-800 text-zinc-300 font-bold">FINAL</span>
                            </template>
                            <template x-if="g.status === 'in_progress'">
                                <span class="px-1.5 py-0.2 rounded bg-red-500/20 text-red-300 border border-red-500/30 font-bold animate-pulse flex items-center">
                                    <span class="w-1.5 h-1.5 rounded-full bg-red-500 mr-1"></span> EN VIVO <span x-text="g.status_detail ? '• ' + g.status_detail : ''" class="ml-1"></span>
                                </span>
                            </template>
                            <template x-if="g.status === 'scheduled'">
                                <span class="text-zinc-500">Próximo partido</span>
                            </template>
                        </div>

                        <!-- Key Game Indicator (Worst Case) and User Pick Indicator -->
                        <div class="flex items-center space-x-2">
                            <template x-if="currentScenario === 'worst_case_win' && g.status !== 'final'">
                                <div>
                                    <template x-if="worstCaseKeyGameIds.includes(g.id)">
                                        <span class="px-2 py-0.5 rounded text-[9px] font-mono font-bold bg-amber-500/20 text-amber-300 border border-amber-500/30">
                                            <i class="fa-solid fa-crown text-[8px] mr-1 text-amber-400"></i> Clave para Ganar
                                        </span>
                                    </template>
                                    <template x-if="!worstCaseKeyGameIds.includes(g.id)">
                                        <span class="px-1.5 py-0.2 rounded text-[9px] font-mono text-zinc-500 bg-zinc-950 border border-zinc-800">
                                            Margen de error
                                        </span>
                                    </template>
                                </div>
                            </template>

                            <template x-if="g.user_picked_id > 0">
                                <span class="text-zinc-400 flex items-center">
                                    Tu pick: <strong class="text-white ml-1 font-bold" x-text="g.user_picked_id === g.away_id ? g.away_code : g.home_code"></strong>
                                </span>
                            </template>
                        </div>
                    </div>

                    <!-- Matchup Simulator Buttons -->
                    <div class="grid grid-cols-11 items-center gap-2">
                        <!-- Away Team Button -->
                        <button type="button"
                                @click="g.status !== 'final' && toggleWinner(g.id, g.away_id)"
                                :disabled="g.status === 'final'"
                                :class="isWinner(g.id, g.away_id) ? 'bg-gradient-to-r from-purple-900/70 to-indigo-900/70 border-purple-500 ring-1 ring-purple-400/50 shadow-md scale-[1.01]' : 'bg-zinc-950/60 border-zinc-800 hover:border-zinc-700'"
                                class="col-span-5 p-2 rounded-xl border flex items-center justify-between transition-all cursor-pointer">
                            <div class="flex items-center space-x-2 min-w-0">
                                <img :src="g.away_logo" :alt="g.away_code" class="w-6 h-6 object-contain shrink-0">
                                <div class="truncate text-left">
                                    <span class="text-xs font-black text-white" x-text="g.away_code"></span>
                                    <span class="text-[10px] text-zinc-400 truncate hidden sm:inline ml-1" x-text="g.away_name"></span>
                                </div>
                            </div>
                            <div class="flex items-center space-x-1.5">
                                <template x-if="g.away_score !== null && g.status !== 'scheduled'">
                                    <span class="font-mono font-bold text-xs text-zinc-300" x-text="g.away_score"></span>
                                </template>
                                <template x-if="isWinner(g.id, g.away_id)">
                                    <i class="fa-solid fa-crown text-amber-400 text-[10px]"></i>
                                </template>
                            </div>
                        </button>

                        <div class="col-span-1 text-center font-mono font-bold text-[10px] text-zinc-600">@</div>

                        <!-- Home Team Button -->
                        <button type="button"
                                @click="g.status !== 'final' && toggleWinner(g.id, g.home_id)"
                                :disabled="g.status === 'final'"
                                :class="isWinner(g.id, g.home_id) ? 'bg-gradient-to-r from-purple-900/70 to-indigo-900/70 border-purple-500 ring-1 ring-purple-400/50 shadow-md scale-[1.01]' : 'bg-zinc-950/60 border-zinc-800 hover:border-zinc-700'"
                                class="col-span-5 p-2 rounded-xl border flex items-center justify-between transition-all cursor-pointer">
                            <div class="flex items-center space-x-1.5">
                                <template x-if="isWinner(g.id, g.home_id)">
                                    <i class="fa-solid fa-crown text-amber-400 text-[10px]"></i>
                                </template>
                                <template x-if="g.home_score !== null && g.status !== 'scheduled'">
                                    <span class="font-mono font-bold text-xs text-zinc-300" x-text="g.home_score"></span>
                                </template>
                            </div>
                            <div class="flex items-center space-x-2 min-w-0 justify-end">
                                <div class="truncate text-right">
                                    <span class="text-[10px] text-zinc-400 truncate hidden sm:inline mr-1" x-text="g.home_name"></span>
                                    <span class="text-xs font-black text-white" x-text="g.home_code"></span>
                                </div>
                                <img :src="g.home_logo" :alt="g.home_code" class="w-6 h-6 object-contain shrink-0">
                            </div>
                        </button>
                    </div>

                    <!-- Mini consensus progress -->
                    <div class="flex items-center justify-between text-[9px] font-mono text-zinc-500 pt-1 border-t border-zinc-900">
                        <span x-text="'Quiniela: ' + g.away_pick_pct + '% ' + g.away_code"></span>
                        <span x-text="g.home_code + ' ' + g.home_pick_pct + '%'"></span>
                    </div>

                </div>
            </template>
        </div>

        <!-- Tab 2: Projected Leaderboard -->
        <div x-show="activeTab === 'leaderboard'" class="p-3 sm:p-4 overflow-y-auto flex-1 space-y-1.5">
            <div class="text-[11px] text-zinc-400 mb-2 font-mono flex items-center justify-between">
                <span>Posiciones proyectadas según ganadores simulados</span>
                <span class="text-purple-400 font-bold" x-text="simulatedGamesCount + ' partidos configurados'"></span>
            </div>

            <template x-for="u in simulatedLeaderboard" :key="u.user_id">
                <div class="p-2.5 rounded-xl border flex items-center justify-between gap-2 transition-all"
                     :class="u.is_current ? 'bg-purple-950/30 border-purple-500/50 ring-1 ring-purple-500/20' : 'bg-zinc-900/60 border-zinc-800/80'">
                    
                    <div class="flex items-center space-x-2.5 min-w-0">
                        <!-- Rank with badge -->
                        <div class="w-8 h-8 rounded-lg bg-zinc-800 border border-zinc-700/80 flex items-center justify-center font-mono font-black text-xs text-white shrink-0"
                             :class="u.sim_rank === 1 ? 'border-amber-400 text-amber-300' : ''"
                             x-text="'#' + u.sim_rank">
                        </div>

                        <!-- Rank Delta Pill -->
                        <div class="w-12 shrink-0 text-center font-mono text-[10px]">
                            <template x-if="u.rank_delta > 0">
                                <span class="text-emerald-400 font-bold" x-text="'▲ +' + u.rank_delta"></span>
                            </template>
                            <template x-if="u.rank_delta < 0">
                                <span class="text-rose-400 font-bold" x-text="'▼ ' + u.rank_delta"></span>
                            </template>
                            <template x-if="u.rank_delta === 0">
                                <span class="text-zinc-600">- 0</span>
                            </template>
                        </div>

                        <!-- Username -->
                        <div class="min-w-0 truncate">
                            <span class="text-xs font-bold text-white truncate" x-text="u.username"></span>
                            <template x-if="u.is_current">
                                <span class="ml-1 text-[9px] font-mono px-1 py-0.2 rounded bg-purple-500/20 text-purple-300 font-bold">TÚ</span>
                            </template>
                        </div>
                    </div>

                    <!-- Points Details -->
                    <div class="flex items-center space-x-3 text-right font-mono shrink-0">
                        <div class="text-[10px] text-zinc-400 hidden sm:block">
                            Base: <span class="text-zinc-300" x-text="u.base_points"></span>
                        </div>
                        <div class="text-[10px] text-purple-400">
                            +<span x-text="u.sim_hits"></span>
                        </div>
                        <div class="text-sm font-black text-white pl-2 border-l border-zinc-800" x-text="u.sim_points + ' pts'">
                        </div>
                    </div>

                </div>
            </template>
        </div>

        <!-- Banner Actions Footer -->
        <div class="p-3 sm:p-4 border-t border-zinc-800/80 bg-zinc-900/80 flex items-center justify-between gap-2">
            <button type="button"
                    @click="closeBanner()"
                    class="px-3.5 py-1.5 rounded-xl border border-zinc-700 text-zinc-300 hover:text-white hover:border-zinc-500 text-xs font-semibold transition-colors cursor-pointer flex items-center space-x-1.5">
                <i class="fa-solid fa-xmark text-xs"></i>
                <span>Cerrar Simulador</span>
            </button>

            <button type="button"
                    @click="shareScenarioWhatsApp()"
                    class="px-3.5 py-1.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-extrabold text-xs transition-all shadow-md flex items-center space-x-1.5 cursor-pointer">
                <i class="fa-brands fa-whatsapp text-sm"></i>
                <span>Compartir Escenario</span>
            </button>
        </div>

    </div>
</div>

<!-- Embedded JSON Payload for Client-Side What-If Simulation -->
<script id="whatif-payload-data" type="application/json">
{{if .WhatIfJSON}}{{.WhatIfJSON}}{{else}}{"games":[],"users":[],"current_user_id":0}{{end}}
</script>

<script>
function whatIfSimulator() {
    return {
        isOpen: false,
        activeTab: 'games',
        currentScenario: 'all_picks', // 'all_picks' | 'worst_case_win' | 'manual' | 'live' | 'consensus'
        worstCaseKeyGameIds: [],
        worstCaseInsight: null,
        simWinners: {},
        games: [],
        users: [],
        currentUserId: 0,
        get whatIfModalOpen() {
            return this.isOpen;
        },
        set whatIfModalOpen(val) {
            if (val) this.openBanner();
            else this.closeBanner();
        },
        openBanner() {
            this.isOpen = true;
            window.__whatIfOpen = true;
        },
        closeBanner() {
            this.isOpen = false;
            window.__whatIfOpen = false;
        },
        toggleBanner() {
            this.isOpen = !this.isOpen;
            window.__whatIfOpen = this.isOpen;
        },
        openModal() {
            this.openBanner();
        },
        closeModal() {
            this.closeBanner();
        },
        init() {
            try {
                const el = document.getElementById('whatif-payload-data');
                if (el && el.textContent) {
                    let text = el.textContent.trim();
                    if (text) {
                        let data = JSON.parse(text);
                        if (typeof data === 'string') {
                            data = JSON.parse(data);
                        }
                        this.games = data.games || [];
                        this.users = data.users || [];
                        this.currentUserId = data.current_user_id || 0;

                        // Default to Pleno ("Si acertaras todas") if user has picks, otherwise live scores
                        const hasUserPicks = this.games.some(g => g.status !== 'final' && g.user_picked_id > 0);
                        if (this.currentUserId > 0 && hasUserPicks) {
                            this.simulateMyPicks();
                        } else {
                            this.simulateLiveScores();
                        }
                    }
                }
            } catch(e) {
                console.error('WhatIf init error:', e);
            }
        },
        simulateMyPicks() {
            this.currentScenario = 'all_picks';
            this.worstCaseKeyGameIds = [];
            this.worstCaseInsight = null;
            this.simWinners = {};
            this.games.forEach(g => {
                if (g.status !== 'final') {
                    if (g.user_picked_id > 0) {
                        this.simWinners[g.id] = g.user_picked_id;
                    } else if (g.current_winner_id > 0) {
                        this.simWinners[g.id] = g.current_winner_id;
                    }
                }
            });
            this.simWinners = Object.assign({}, this.simWinners);
        },
        simulateWorstCaseWin() {
            this.currentScenario = 'worst_case_win';
            const pendingGames = this.games.filter(g => g.status !== 'final');
            if (pendingGames.length === 0 || !this.users || this.users.length === 0) {
                this.worstCaseInsight = null;
                this.worstCaseKeyGameIds = [];
                return;
            }

            const me = this.users.find(u => u.is_current);
            if (!me) {
                this.worstCaseInsight = null;
                this.worstCaseKeyGameIds = [];
                return;
            }

            // Helper function to evaluate current user's rank under a specific winner assignment
            const evalRank = (winners) => {
                const scores = this.users.map(u => {
                    let pts = u.base_points;
                    pendingGames.forEach(g => {
                        const winId = winners[g.id];
                        if (winId && u.picks && u.picks[g.id] === winId) {
                            pts += 1;
                        }
                    });
                    return { user_id: u.user_id, points: pts, is_current: u.is_current, username: u.username };
                });
                scores.sort((a, b) => b.points - a.points || a.username.localeCompare(b.username));
                const myIdx = scores.findIndex(s => s.is_current);
                return { rank: myIdx + 1, scores: scores };
            };

            // 1. Determine best possible rank the user can reach (targetRank)
            const allPicksWinners = {};
            pendingGames.forEach(g => {
                if (g.user_picked_id > 0) {
                    allPicksWinners[g.id] = g.user_picked_id;
                } else {
                    allPicksWinners[g.id] = g.away_id;
                }
            });
            const bestOutcome = evalRank(allPicksWinners);
            const targetRank = Math.max(1, bestOutcome.rank);

            // 2. Base Hostile Scenario:
            // For each game, assign the outcome that is worst for the user:
            // If user picked team A, hostile winner is team B (user gets 0, rivals picking B get +1).
            const hostileWinners = {};
            pendingGames.forEach(g => {
                if (g.user_picked_id > 0) {
                    hostileWinners[g.id] = (g.user_picked_id === g.away_id) ? g.home_id : g.away_id;
                } else {
                    hostileWinners[g.id] = g.consensus_id || g.away_id;
                }
            });

            // If user already reaches targetRank under complete hostile scenario (huge lead):
            const baseHostileEval = evalRank(hostileWinners);
            if (baseHostileEval.rank <= targetRank) {
                this.simWinners = Object.assign({}, hostileWinners);
                this.worstCaseKeyGameIds = [];
                this.worstCaseInsight = {
                    neededWins: 0,
                    totalPending: pendingGames.length,
                    targetRank: targetRank
                };
                return;
            }

            // 3. Find minimal subset of games the user must win to secure targetRank
            let chosenWins = [];

            if (pendingGames.length <= 11) {
                // Exact search over combinations of size k = 1, 2, ...
                let found = false;
                const gamesWithPicks = pendingGames.filter(g => g.user_picked_id > 0);

                function getCombinations(arr, k) {
                    if (k === 0) return [[]];
                    if (arr.length === 0) return [];
                    const head = arr[0];
                    const tail = arr.slice(1);
                    const withHead = getCombinations(tail, k - 1).map(c => [head, ...c]);
                    const withoutHead = getCombinations(tail, k);
                    return withHead.concat(withoutHead);
                }

                for (let k = 1; k <= gamesWithPicks.length; k++) {
                    const combos = getCombinations(gamesWithPicks, k);
                    for (let combo of combos) {
                        const testWinners = Object.assign({}, hostileWinners);
                        combo.forEach(g => {
                            testWinners[g.id] = g.user_picked_id;
                        });
                        const res = evalRank(testWinners);
                        if (res.rank <= targetRank) {
                            chosenWins = combo;
                            found = true;
                            break;
                        }
                    }
                    if (found) break;
                }
            }

            // If exact search didn't find or pendingGames > 11, use greedy selection + reverse pruning
            if (chosenWins.length === 0) {
                let currentWinners = Object.assign({}, hostileWinners);
                const candidates = pendingGames.filter(g => g.user_picked_id > 0);
                const selected = [];

                while (candidates.length > 0) {
                    const curEval = evalRank(currentWinners);
                    if (curEval.rank <= targetRank) break;

                    let bestCand = null;
                    let bestScore = -9999;
                    let bestIdx = -1;

                    candidates.forEach((cand, idx) => {
                        const testW = Object.assign({}, currentWinners);
                        testW[cand.id] = cand.user_picked_id;
                        const testRes = evalRank(testW);
                        const rankGain = curEval.rank - testRes.rank;
                        const myPts = testRes.scores.find(s => s.is_current).points;
                        const leadPts = testRes.scores[0].points;
                        const gap = myPts - leadPts;
                        const score = (rankGain * 100) + gap;

                        if (score > bestScore) {
                            bestScore = score;
                            bestCand = cand;
                            bestIdx = idx;
                        }
                    });

                    if (bestCand) {
                        currentWinners[bestCand.id] = bestCand.user_picked_id;
                        selected.push(bestCand);
                        candidates.splice(bestIdx, 1);
                    } else {
                        break;
                    }
                }

                // Pruning pass: see if any selected game is redundant
                for (let i = selected.length - 1; i >= 0; i--) {
                    const testW = Object.assign({}, currentWinners);
                    const cand = selected[i];
                    testW[cand.id] = hostileWinners[cand.id];
                    if (evalRank(testW).rank <= targetRank) {
                        currentWinners[cand.id] = hostileWinners[cand.id];
                        selected.splice(i, 1);
                    }
                }
                chosenWins = selected;
            }

            // Finalize scenario
            const finalWinners = Object.assign({}, hostileWinners);
            chosenWins.forEach(g => {
                finalWinners[g.id] = g.user_picked_id;
            });

            this.simWinners = finalWinners;
            this.worstCaseKeyGameIds = chosenWins.map(g => g.id);
            this.worstCaseInsight = {
                neededWins: chosenWins.length,
                totalPending: pendingGames.length,
                targetRank: targetRank
            };
        },
        toggleWinner(gameId, teamId) {
            this.currentScenario = 'manual';
            this.worstCaseKeyGameIds = [];
            this.worstCaseInsight = null;
            if (this.simWinners[gameId] === teamId) {
                delete this.simWinners[gameId];
            } else {
                this.simWinners[gameId] = teamId;
            }
            this.simWinners = Object.assign({}, this.simWinners);
        },
        simulateLiveScores() {
            this.currentScenario = 'live';
            this.worstCaseKeyGameIds = [];
            this.worstCaseInsight = null;
            this.simWinners = {};
            this.games.forEach(g => {
                if (g.current_winner_id > 0) {
                    this.simWinners[g.id] = g.current_winner_id;
                }
            });
            this.simWinners = Object.assign({}, this.simWinners);
        },
        simulateConsensus() {
            this.currentScenario = 'consensus';
            this.worstCaseKeyGameIds = [];
            this.worstCaseInsight = null;
            this.games.forEach(g => {
                if (g.status !== 'final' && g.consensus_id > 0) {
                    this.simWinners[g.id] = g.consensus_id;
                }
            });
            this.simWinners = Object.assign({}, this.simWinners);
        },
        resetAll() {
            this.currentScenario = 'manual';
            this.worstCaseKeyGameIds = [];
            this.worstCaseInsight = null;
            this.simWinners = {};
        },
        isWinner(gameId, teamId) {
            return this.simWinners[gameId] === teamId;
        },
        get simulatedLeaderboard() {
            if (!this.users || this.users.length === 0) return [];

            // Baseline ranking (final games + live current leader)
            const baseRankings = this.users.map(u => {
                let curPts = u.base_points;
                this.games.forEach(g => {
                    if (g.status === 'in_progress' && g.current_winner_id > 0) {
                        if (u.picks && u.picks[g.id] === g.current_winner_id) {
                            curPts += 1;
                        }
                    }
                });
                return { user_id: u.user_id, points: curPts, username: u.username };
            });
            baseRankings.sort((a, b) => b.points - a.points || a.username.localeCompare(b.username));
            const initialRankMap = {};
            baseRankings.forEach((item, idx) => {
                initialRankMap[item.user_id] = idx + 1;
            });

            // Simulated ranking based on simWinners
            const list = this.users.map(u => {
                let simPts = u.base_points;
                let newHits = 0;
                this.games.forEach(g => {
                    if (g.status !== 'final') {
                        const winId = this.simWinners[g.id];
                        if (winId && u.picks && u.picks[g.id] === winId) {
                            simPts += 1;
                            newHits += 1;
                        }
                    }
                });
                return {
                    user_id: u.user_id,
                    username: u.username,
                    avatar_url: u.avatar_url,
                    is_current: u.is_current,
                    base_points: u.base_points,
                    sim_points: simPts,
                    sim_hits: newHits,
                    initial_rank: initialRankMap[u.user_id] || 99
                };
            });

            list.sort((a, b) => b.sim_points - a.sim_points || a.username.localeCompare(b.username));
            list.forEach((u, idx) => {
                u.sim_rank = idx + 1;
                u.rank_delta = u.initial_rank - u.sim_rank;
            });

            return list;
        },
        get currentUserSim() {
            return this.simulatedLeaderboard.find(u => u.is_current) || null;
        },
        get simulatedGamesCount() {
            return Object.keys(this.simWinners).length;
        },
        shareScenarioWhatsApp() {
            const cur = this.currentUserSim;
            let text = '🔮 *Simulador NFL Quiniela 2026*\n';
            if (this.currentScenario === 'all_picks') {
                text += '🎯 *Escenario Pleno (Mis Picks)*\n';
                if (cur) text += `¡Si acierto todas mis selecciones restantes proyecto alcanzar la posición #${cur.sim_rank} con ${cur.sim_points} pts! 🏆\n`;
            } else if (this.currentScenario === 'worst_case_win' && this.worstCaseInsight) {
                text += '🛡️ *Peor Escenario para Ganar*\n';
                text += `¡Aún en el peor escenario aseguro la posición #${this.worstCaseInsight.targetRank} ganando solo ${this.worstCaseInsight.neededWins} de ${this.worstCaseInsight.totalPending} partidos clave! 🏈\n`;
            } else {
                if (cur) {
                    text += `¡Con esta simulación de partidos proyecto alcanzar la posición #${cur.sim_rank} con ${cur.sim_points} puntos! 📈\n`;
                }
            }
            text += `Partidos configurados: ${this.simulatedGamesCount} de ${this.games.length}\n`;
            text += `👉 Entra al Game Center en vivo: ${window.location.origin}/live`;
            const url = 'https://api.whatsapp.com/send?text=' + encodeURIComponent(text);
            window.open(url, '_blank');
        }
    };
}
</script>
