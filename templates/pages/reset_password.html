{{template "base.html" .}}

{{define "title"}}Restablecer Contraseña - NFL Quiniela 2026{{end}}

{{define "content"}}
<div class="min-h-[70vh] flex items-center justify-center py-10">
    <div class="w-full max-w-sm vercel-card p-8 rounded-2xl shadow-xl">
        
        <div class="text-center mb-6">
            <div class="w-10 h-10 rounded-xl bg-white text-black flex items-center justify-center mx-auto mb-3 font-black text-base shadow-sm">
                <i class="fa-solid fa-lock"></i>
            </div>
            <h1 class="text-xl font-bold tracking-tight text-white">Nueva Contraseña</h1>
            <p class="text-xs text-zinc-400 mt-1">Ingresa tu nueva clave de acceso</p>
        </div>

        {{if .Error}}
            <div class="mb-5 p-3 rounded-xl bg-red-950/40 border border-red-500/30 text-red-300 text-xs flex items-center space-x-2">
                <i class="fa-solid fa-circle-exclamation text-red-400"></i>
                <span>{{.Error}}</span>
            </div>
        {{end}}

        {{if not .Invalid}}
        <form action="/reset-password" method="POST" class="space-y-3.5">
            <input type="hidden" name="token" value="{{.Token}}">

            <div>
                <label class="block text-[11px] font-mono uppercase tracking-wider text-zinc-400 mb-1.5 font-medium">Nueva Contraseña (mínimo 6 caracteres)</label>
                <input type="password" name="password" required minlength="6" placeholder="••••••••" autofocus
                       class="w-full px-3.5 py-2 rounded-xl bg-zinc-900 border border-zinc-700/80 text-white text-xs focus:outline-none focus:border-white focus:ring-1 focus:ring-white transition-all placeholder:text-zinc-600">
            </div>

            <div>
                <label class="block text-[11px] font-mono uppercase tracking-wider text-zinc-400 mb-1.5 font-medium">Confirmar Nueva Contraseña</label>
                <input type="password" name="confirm_password" required minlength="6" placeholder="••••••••"
                       class="w-full px-3.5 py-2 rounded-xl bg-zinc-900 border border-zinc-700/80 text-white text-xs focus:outline-none focus:border-white focus:ring-1 focus:ring-white transition-all placeholder:text-zinc-600">
            </div>

            <button type="submit" class="w-full mt-2 py-2.5 rounded-xl bg-white hover:bg-zinc-200 text-black font-semibold text-xs transition-colors shadow-sm">
                Actualizar Contraseña
            </button>
        </form>
        {{else}}
        <div class="text-center pt-2">
            <a href="/forgot-password" class="inline-block py-2.5 px-4 rounded-xl bg-white text-black font-semibold text-xs transition-colors shadow-sm">
                Solicitar Nuevo Enlace
            </a>
        </div>
        {{end}}

        <div class="mt-6 pt-5 border-t border-zinc-800/80 text-center text-xs text-zinc-500">
            <a href="/login" class="text-zinc-400 hover:text-white transition-colors flex items-center justify-center">
                <i class="fa-solid fa-arrow-left mr-1.5 text-[10px]"></i> Cancelar y volver al login
            </a>
        </div>

    </div>
</div>
{{end}}
