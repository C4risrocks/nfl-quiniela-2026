{{template "base.html" .}}

{{define "title"}}Iniciar Sesión - NFL Quiniela 2026{{end}}

{{define "content"}}
<div class="min-h-[70vh] flex items-center justify-center py-10">
    <div class="w-full max-w-sm vercel-card p-8 rounded-2xl shadow-xl">
        
        <div class="text-center mb-6">
            <div class="w-10 h-10 rounded-xl bg-white text-black flex items-center justify-center mx-auto mb-3 font-black text-base shadow-sm">
                <i class="fa-solid fa-arrow-right-to-bracket"></i>
            </div>
            <h1 class="text-xl font-bold tracking-tight text-white">Iniciar Sesión</h1>
            <p class="text-xs text-zinc-400 mt-1">Ingresa a tu cuenta de quiniela</p>
        </div>

        {{if .Success}}
            <div class="mb-4 p-3 rounded-xl bg-emerald-950/40 border border-emerald-500/30 text-emerald-300 text-xs flex items-center space-x-2">
                <i class="fa-solid fa-circle-check text-emerald-400"></i>
                <span>{{.Success}}</span>
            </div>
        {{end}}

        {{if .Error}}
            <div class="mb-4 p-3 rounded-xl bg-red-950/40 border border-red-500/30 text-red-300 text-xs flex items-center space-x-2">
                <i class="fa-solid fa-circle-exclamation text-red-400"></i>
                <span>{{.Error}}</span>
            </div>
        {{end}}

        <form action="/login" method="POST" class="space-y-3.5">
            <div>
                <label class="block text-[11px] font-mono uppercase tracking-wider text-zinc-400 mb-1.5 font-medium">Usuario o Correo</label>
                <input type="text" name="username" required autofocus placeholder="tu_usuario"
                       class="w-full px-3.5 py-2 rounded-xl bg-zinc-900 border border-zinc-700/80 text-white text-xs focus:outline-none focus:border-white focus:ring-1 focus:ring-white transition-all placeholder:text-zinc-600">
            </div>

            <div>
                <div class="flex items-center justify-between mb-1.5">
                    <label class="block text-[11px] font-mono uppercase tracking-wider text-zinc-400 font-medium">Contraseña</label>
                    <a href="/forgot-password" class="text-[11px] text-zinc-400 hover:text-white transition-colors">¿La olvidaste?</a>
                </div>
                <input type="password" name="password" required placeholder="••••••••"
                       class="w-full px-3.5 py-2 rounded-xl bg-zinc-900 border border-zinc-700/80 text-white text-xs focus:outline-none focus:border-white focus:ring-1 focus:ring-white transition-all placeholder:text-zinc-600">
            </div>

            <button type="submit" class="w-full mt-2 py-2.5 rounded-xl bg-white hover:bg-zinc-200 text-black font-semibold text-xs transition-colors shadow-sm">
                Continuar
            </button>
        </form>

        <div class="mt-6 pt-5 border-t border-zinc-800/80 text-center text-xs text-zinc-500">
            ¿No tienes cuenta aún? 
            <a href="/register" class="text-white hover:underline font-semibold ml-1">Regístrate</a>
        </div>

    </div>
</div>
{{end}}
