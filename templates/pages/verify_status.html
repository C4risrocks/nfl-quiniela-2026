{{template "base.html" .}}

{{define "title"}}Verificación de Correo - NFL Quiniela 2026{{end}}

{{define "content"}}
<div class="min-h-[60vh] flex items-center justify-center py-12">
    <div class="w-full max-w-md vercel-card p-8 rounded-2xl shadow-xl text-center">
        
        {{if .Success}}
            <div class="w-16 h-16 rounded-2xl bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 flex items-center justify-center mx-auto mb-4 text-2xl shadow-inner">
                <i class="fa-solid fa-circle-check"></i>
            </div>
            <h1 class="text-xl font-bold tracking-tight text-white mb-2">¡Correo Verificado!</h1>
            <p class="text-xs text-zinc-400 mb-6 leading-relaxed">
                {{.Message}}
            </p>
            <div class="space-y-3">
                <a href="/picks" class="block w-full py-2.5 rounded-xl bg-white hover:bg-zinc-200 text-black font-semibold text-xs transition-colors shadow-sm">
                    Ir a Mis Pronósticos &rarr;
                </a>
            </div>
        {{else}}
            <div class="w-16 h-16 rounded-2xl bg-red-500/10 border border-red-500/30 text-red-400 flex items-center justify-center mx-auto mb-4 text-2xl shadow-inner">
                <i class="fa-solid fa-circle-xmark"></i>
            </div>
            <h1 class="text-xl font-bold tracking-tight text-white mb-2">Enlace Inválido</h1>
            <p class="text-xs text-zinc-400 mb-6 leading-relaxed">
                {{.Message}}
            </p>
            <div class="space-y-3">
                <a href="/login" class="block w-full py-2.5 rounded-xl bg-zinc-900 border border-zinc-700 hover:border-zinc-500 text-white font-semibold text-xs transition-colors shadow-sm">
                    Iniciar Sesión
                </a>
            </div>
        {{end}}

    </div>
</div>
{{end}}
