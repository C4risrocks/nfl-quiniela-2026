services:
  quiniela:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nfl-quiniela-2026
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - APP_ENV=${APP_ENV:-production}
      - BEHIND_PROXY=${BEHIND_PROXY:-false}
      - TRUSTED_PROXIES=${TRUSTED_PROXIES:-}
      - PORT=8080
      - DB_TYPE=sqlite
      - DB_PATH=/app/data/quiniela.db
      # If migrating to PostgreSQL later in Dokploy:
      # - DB_TYPE=postgres
      # - DATABASE_URL=postgres://user:password@postgres-service:5432/quiniela?sslmode=disable
      - SESSION_SECRET=${SESSION_SECRET:?Set SESSION_SECRET}
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?Set ADMIN_PASSWORD}
      - ADMIN_EMAIL=admin@quiniela.com
      - ENABLE_BACKGROUND_SYNC=true
      - ESPN_SYNC_INTERVAL_MINS=5
      - CURRENT_SEASON_YEAR=2026
      # Email Service (Gmail SMTP)
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - APP_BASE_URL=${APP_BASE_URL:-http://localhost:8080}
      - ENABLE_REMINDERS=${ENABLE_REMINDERS:-true}
    volumes:
      # Named volume for Dokploy automated backups and persistent SQLite storage
      - quiniela_data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  quiniela_data:
    name: quiniela_data
