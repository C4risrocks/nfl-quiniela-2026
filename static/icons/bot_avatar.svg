<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="botGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="faceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="url(#botGrad)" stroke="#818cf8" stroke-width="2"/>
  <!-- Antenna -->
  <line x1="50" y1="20" x2="50" y2="30" stroke="#f8fafc" stroke-width="3" stroke-linecap="round"/>
  <circle cx="50" cy="18" r="4" fill="#38bdf8"/>
  <!-- Head -->
  <rect x="24" y="30" width="52" height="42" rx="10" fill="url(#faceGrad)" stroke="#94a3b8" stroke-width="2"/>
  <!-- Visor / Eyes -->
  <rect x="30" y="38" width="40" height="15" rx="6" fill="#082f49" stroke="#38bdf8" stroke-width="1.5"/>
  <!-- Glowing Eye dots -->
  <circle cx="39" cy="45.5" r="4" fill="#38bdf8"/>
  <circle cx="61" cy="45.5" r="4" fill="#38bdf8"/>
  <circle cx="40" cy="44.5" r="1.5" fill="#ffffff"/>
  <circle cx="62" cy="44.5" r="1.5" fill="#ffffff"/>
  <!-- Mouth / Grille -->
  <rect x="36" y="59" width="28" height="4" rx="2" fill="#38bdf8" opacity="0.8"/>
  <!-- Ear pieces -->
  <rect x="18" y="42" width="6" height="16" rx="3" fill="#cbd5e1"/>
  <rect x="76" y="42" width="6" height="16" rx="3" fill="#cbd5e1"/>
  <!-- Chest / Shoulders -->
  <path d="M28 72 L72 72 L82 86 C82 86 50 94 18 86 Z" fill="url(#faceGrad)" stroke="#94a3b8" stroke-width="2"/>
  <!-- Chest light -->
  <circle cx="50" cy="78" r="2.5" fill="#22c55e"/>
</svg>
